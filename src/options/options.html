<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unipply — Profile</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <img src="../../assets/branding/logo.png" alt="Unipply" class="logo" />

        <div class="progress-wrap">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <span id="progress-label" class="progress-label"></span>
        </div>

        <nav id="nav-list" class="nav-list"></nav>

        <p id="status-pill" class="status-pill"></p>
      </aside>

      <main id="panel" class="panel"></main>
    </div>

    <input type="file" id="import-profile" accept="application/json" hidden />

    <script type="module" src="options.js"></script>
  </body>
</html>
