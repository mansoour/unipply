<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unipply</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../../assets/branding/logo.png" alt="Unipply" class="popup-logo" />
      </div>
      <button id="open-options" type="button" class="link-btn">Manage</button>
    </header>

    <main>
      <button id="scan-btn" type="button" class="primary full-width">
        <span class="btn-icon" data-icon="scan"></span>
        <span>Scan this page</span>
      </button>
      <p id="status" class="status"></p>
      <p id="file-note" class="file-note"></p>
      <div id="entry-pickers"></div>

      <div id="results-list"></div>

      <button id="fill-btn" type="button" class="primary full-width" disabled>
        <span class="btn-icon" data-icon="edit"></span>
        <span>Fill approved fields</span>
      </button>
      <div id="tracker-prompt" class="tracker-prompt"></div>
      <p class="disclaimer">
        <span class="disclaimer-icon" data-icon="shieldCheck"></span>
        <span>Nothing is ever submitted automatically — review the page before you click Submit.</span>
      </p>
    </main>

    <footer class="app-footer">
      <div class="footer-left">
        <button id="footer-settings" type="button" class="footer-settings-btn">
          <span class="btn-icon" data-icon="settings"></span>
          <span>Settings</span>
        </button>
        <a href="https://mansoour.com/unipply/privacy-policy.html" target="_blank" rel="noopener" class="footer-privacy-link">Privacy Policy</a>
      </div>
      <span class="footer-copyright">
        © <span id="popup-year"></span> Unipply · Built by
        <a href="https://mansoour.com" target="_blank" rel="noopener">Mansoour</a>
      </span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
