<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unipply</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="../../assets/icons/icon32.png" alt="" class="popup-logo" />
        <h1>Unipply</h1>
      </div>
      <button id="open-options" type="button" class="link-btn">Manage</button>
    </header>

    <main>
      <button id="scan-btn" type="button" class="primary full-width">Scan this page</button>
      <p id="status" class="status"></p>
      <p id="file-note" class="file-note"></p>

      <div id="results-list"></div>

      <button id="fill-btn" type="button" class="primary full-width" disabled>Fill approved fields</button>
      <div id="tracker-prompt" class="tracker-prompt"></div>
      <p class="disclaimer">Nothing is ever submitted automatically — review the page before you click Submit.</p>
    </main>

    <footer class="app-footer">
      © <span id="popup-year"></span> Unipply · Built by
      <a href="https://mansoour.com" target="_blank" rel="noopener">Mansoour</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
